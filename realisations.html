<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réalisations, Flow Studio</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --noir: #0F0F0F; --beige: #EAE6E1; --blanc: #F7F5F2; --taupe: #B5ADA5; --font-display: 'Playfair Display', Georgia, serif; --font-body: 'Inter', sans-serif; }
  body { background: var(--blanc); color: var(--noir); font-family: var(--font-body); font-weight: 300; }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 1.4rem 4rem; background: rgba(247,245,242,0.94); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(181,173,165,0.2); }
  .nav-logo { font-family: var(--font-display); font-size: 1.1rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--noir); text-decoration: none; }
  .nav-logo span { font-size: 0.55rem; letter-spacing: 0.4em; display: block; text-align: center; margin-top: -2px; color: var(--taupe); }
  .nav-cta { font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; padding: 0.65rem 1.5rem; border: 1px solid var(--noir); color: var(--noir); text-decoration: none; transition: all 0.3s; }
  .nav-cta:hover { background: var(--noir); color: var(--blanc); }
  .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
  .eyebrow { font-size: 0.62rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--taupe); margin-bottom: 1.5rem; }
  .title { font-family: var(--font-display); font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 400; line-height: 1.1; margin-bottom: 1.5rem; }
  .title em { font-style: italic; color: var(--taupe); }
  .subtitle { font-size: 0.88rem; color: #6B6560; max-width: 440px; line-height: 1.9; margin-bottom: 2.5rem; }
  .btn { display: inline-block; font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; padding: 1rem 2.2rem; background: var(--noir); color: var(--blanc); text-decoration: none; border: 1px solid var(--noir); transition: all 0.3s; }
  .btn:hover { background: transparent; color: var(--noir); }
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">FLOW<span>STUDIO</span></a>
  <a href="https://calendar.app.google/x3LrzMWr5spjaSn56" target="_blank" class="nav-cta">Prendre rendez-vous</a>
</nav>
<div class="page">
  <p class="eyebrow">Réalisations</p>
  <h1 class="title">Bientôt disponible.<br><em>En cours de construction.</em></h1>
  <p class="subtitle">Les cas clients et réalisations Flow Studio arrivent prochainement. En attendant, parlons de votre projet.</p>
  <a href="https://calendar.app.google/x3LrzMWr5spjaSn56" target="_blank" class="btn">Prendre rendez-vous</a>
</div>
</body>
</html>
