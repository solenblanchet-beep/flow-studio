<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable | Flow Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --noir: #0F0F0F; --blanc: #F7F5F2; --taupe: #B5ADA5; --texte: #524E4A;
    --font-display: 'Playfair Display', Georgia, serif; --font-body: 'Inter', sans-serif; }
  @media (prefers-color-scheme: dark) { :root { --noir: #F0EDE8; --blanc: #141210; --texte: rgba(240,237,232,0.75); } }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--blanc); color: var(--noir); font-family: var(--font-body); font-weight: 300; line-height: 1.7; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 1.8rem 1.5rem; }
  .logo { font-family: var(--font-display); font-size: 1.1rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--noir); text-decoration: none; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 640px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }
  .eyebrow { font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--taupe); margin-bottom: 1.2rem; }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.15; margin-bottom: 1.5rem; }
  h1 em { font-style: italic; color: var(--taupe); }
  p.text { color: var(--texte); font-size: 0.95rem; margin-bottom: 2rem; }
  ul { list-style: none; display: flex; flex-direction: column; gap: 0.8rem; }
  ul a { color: var(--noir); font-size: 0.95rem; text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<header><a href="/" class="logo">Flow Studio</a></header>
<main>
  <p class="eyebrow">Erreur 404</p>
  <h1>Cette page n'existe pas,<br><em>ou plus à cette adresse.</em></h1>
  <p class="text">Le lien est peut-être ancien. Voici les pages les plus utiles pour reprendre :</p>
  <ul>
    <li><a href="/">Accueil</a></li>
    <li><a href="/solutions">Les solutions : TPE, PME et cabinets</a></li>
    <li><a href="/diagnostic-ia">Le Diagnostic</a></li>
    <li><a href="/blog/">Le blog</a></li>
    <li><a href="/contact">Contact</a></li>
  </ul>
</main>
</body>
</html>
